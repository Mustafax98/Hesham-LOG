<body class="font-body-md text-on-surface antialiased">
    <!-- TopAppBar Section -->
    <header

            <span

    </header>
    <main class="pt-24 pb-12 px-6 min-h-screen flex flex-col items-center">
        <!-- Hero Section -->
        <div class="w-full max-w-md mt-8 mb-10">
            <div class="flex items-center gap-2 mb-4">
                <span
                    class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.2em]">Operations
                    Portal</span>
            </div>
            <h1 class="font-h1 text-h1 text-primary leading-tight">
                The global standard for <span class="text-secondary-container">fleet precision.</span>
            </h1>
        </div>
        <!-- Login Card -->
        <div class="w-full max-w-md bg-white border border-surface-container-high rounded-lg p-8 shadow-sm">
            <div class="mb-8">
                <p class="font-body-md text-on-surface-variant">Sign in to your operation hub</p>
            </div>
            <form class="space-y-6">
                <!-- Phone Input -->
                <div class="space-y-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant block">PHONE NUMBER</label>
                    <div class="flex">

                        </div>
                        <input
                            class="w-full px-4 py-3 border border-outline-variant rounded-r-lg focus:ring-0 focus:border-primary font-body-md placeholder:text-outline-variant"

                    </div>
                </div>
                <!-- Authenticate Button -->
                <a href="Orderspage.html.html"
                    class="w-full bg-primary text-on-primary py-4 rounded-lg font-button text-button flex items-center justify-center gap-2 hover:opacity-90 transition-opacity uppercase tracking-widest">
                    <span>AUTHENTICATE</span>
                    <span class="material-symbols-outlined text-[20px]">login</span>
                </a>
            </form>
            <!-- Divider -->
            <div class="relative my-10">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-surface-container-high"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white px-4 text-outline font-label-caps tracking-widest">CORPORATE IDENTITY</span>
                </div>
            </div>
            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-4">
                <button
                    class="flex items-center justify-center h-12 border border-surface-container text-on-surface font-label-caps hover:bg-surface-container transition-colors gap-xs">
                    <img alt="Google" class="w-5 h-5 grayscale opacity-70"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDl-aEh5EFsI6eE6vyGVs6mrsijMGw-kAsHhp_4hYK_vAMslvzivQgACDsvsm2ELxp8L9P5aznmFvK8vcQTKA6EZATKAccv-iJqhv9UX69h_a2mspNGc_SHMWyem9qrNdEMrUrpO5BErCHjP6mecapwnLnCdu_eWPmlp5xiu0Of-16yNAJkQ2nW_ZbT2cDBtg0jJWxyqDmP07IPSpQ4i7Y_onzCTrehwPGzdDuYR4Hnoqvx-WkVmhY0nf_76-LwuTSyhr4Md1FTg" />

                    <span>نسيت كلمة المرور</span>
                    <span
