<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght=400;600;700;800;900&amp;family=Inter:wght=400;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        details summary {
            list-style: none;
        }

        details[open] .expand-icon {
            transform: rotate(180deg);
        }

        th,
        td {
            border: 1px solid #e7e8ed;
        }
    </style>
</head>

<body class="bg-surface">
    <header
        class="bg-white dark:bg-zinc-950 docked full-width top-0 z-50 border-b border-zinc-200 dark:border-zinc-800 flex justify-between items-center h-16 px-4 w-full fixed">
        <div class="flex items-center gap-2">
            <button
                class="transition-all duration-200 ease-in-out hover:bg-zinc-50 dark:hover:bg-zinc-900 p-2 rounded-lg relative">
                <span class="material-symbols-outlined text-black dark:text-white">notifications</span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-secondary-container rounded-full"></span>
            </button>
        </div>
        <div class="flex items-center gap-4">
            <p class="font-['Public_Sans'] font-semibold tracking-tight text-base text-black dark:text-white">أهلاً بك
                يا احمد</p>
            <h1 class="font-['Public_Sans'] font-semibold tracking-tight text-base text-black dark:text-white">Quick-XOS
            </h1>
        </div>
    </header>

    <main class="pt-20 pb-24 px-4 max-w-lg mx-auto">
        <div id="pending-section">
            <div id="orders-container" class="space-y-4">
                <p class="text-center text-zinc-500 py-4">جاري التحميل ..</p>
            </div>
        </div>

        <div id="delivered-section" class="hidden space-y-4">
            <div class="flex items-center gap-2 bg-white p-2 border border-zinc-200 shadow-sm mb-4 rounded-lg">
                <span class="text-xs font-bold text-zinc-500 pr-1">تصفية:</span>
                <select id="status-filter" onchange="filterDeliveredOrders()"
                    class="flex-1 bg-zinc-50 border border-zinc-300 text-zinc-800 text-sm rounded-md p-1.5 focus:ring-black focus:border-black">
                    <option value="all">كل الطلبات</option>
                    <option value="delivered">تم التسليم</option>
                    <option value="canceled">الملغي</option>
                    <option value="postponed">المؤجل</option>
                </select>
            </div>
            <div id="delivered-container" class="space-y-4"></div>
        </div>

        <div id="profile-section" class="hidden space-y-6">
            <div class="bg-white p-6 border border-zinc-200 shadow-sm rounded-xl text-center">
                <div
                    class="w-20 h-20 bg-zinc-100 rounded-full flex items-center justify-center mx-auto mb-3 border border-zinc-300">
                    <span class="material-symbols-outlined text-[40px] text-zinc-600">account_circle</span>
                </div>
                <h2 class="text-lg font-bold text-zinc-800">احمد</h2>
            </div>

            <div
                class="bg-gradient-to-br from-zinc-900 to-black p-6 text-white shadow-md rounded-xl relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 opacity-10">
                    <span class="material-symbols-outlined text-[120px]">payments</span>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm font-medium text-zinc-400">إجمالي المحفظة الحالية</span>
                    <span class="material-symbols-outlined text-green-400">account_balance_wallet</span>
                </div>
                <div class="flex items-baseline gap-2">
                    <span id="wallet-total" class="text-3xl font-black tracking-tight text-white">0</span>
                    <span class="text-sm font-bold text-green-400">جنيه مصري</span>
                </div>
                <p class="text-[11px] text-zinc-400 mt-4 border-t border-zinc-800 pt-3">
                    * يتم احتساب الطلبات المسلمة بنجاح فقط وتجاهل الطلبات الملغية.
                </p>
            </div>
        </div>
    </main>

    <nav
        class="fixed bottom-0 left-0 w-full h-16 flex justify-around items-center bg-white dark:bg-zinc-950 px-2 pb-safe border-t border-zinc-200 dark:border-zinc-800 z-50">
        <button id="btn-pending" class="flex flex-col items-center justify-center text-[#fd761a]"
            onclick="showTab('pending')">
            <span class="material-symbols-outlined">assignment</span>
            <span class="text-xs">Orders</span>
        </button>

        <button id="btn-delivered" class="flex flex-col items-center justify-center text-zinc-400"
            onclick="showTab('delivered')">
            <span class="material-symbols-outlined">assignment_turned_in</span>
            <span class="text-xs">Delivered</span>
        </button>

        <button id="btn-profile" class="flex flex-col items-center justify-center text-zinc-400"
            onclick="showTab('profile')">
            <span class="material-symbols-outlined">person</span>
            <span class="text-xs">Profile</span>
        </button>
    </nav>

    <script>
        // ⚠️ استبدل هذا الرابط بالرابط الجديد الخاص بك بعد النشر
        const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxSlA0ZX5VOkqFv2PPLhTtFS_CDvztPYBxRlExTac68QJy8rlPYTGrHc-qtlW0F7cbAtw/exec';
        const WHATSAPP_NUMBER = '+201063942602';

        let openedOrders = new Set();

        async function loadOrders() {
            try {
                const detailsElements = document.querySelectorAll('details');
                detailsElements.forEach(detail => {
                    const id = detail.getAttribute('data-order-id');
                    if (detail.hasAttribute('open') && id) {
                        openedOrders.add(id);
                    } else if (id) {
                        openedOrders.delete(id);
                    }
                });



                const response = await fetch(`${SHEET_API_URL}?_=${new Date().getTime()}`);
                const orders = await response.json();

                const pendingContainer = document.getElementById('orders-container');
                const deliveredContainer = document.getElementById('delivered-container');

                pendingContainer.innerHTML = '';
                deliveredContainer.innerHTML = '';

                if (orders.length === 0) {
                    pendingContainer.innerHTML = '<p class="text-center text-zinc-500 py-4">لا توجد طلبات حالياً.</p>';
                    document.getElementById('wallet-total').innerText = '0';
                    return;
                }

                let hasPending = false;
                let hasDelivered = false;
                let totalWalletAmount = 0;

                orders.forEach(order => {
    const orderId = order.orderId || '';
    const currentStatus = String(order.status || '').trim();
    const companyName = order.companyName || '';
    const officeName = order.officeName || ''; // بيانات جديدة
    const price = order.price || '0';
    const area = order.area || '';
    const customerName = order.customerName || '';
    const phoneNumber = order.phoneNumber || '';
    const address = order.address || '';
    const mark = order.mark || '-';
    const propertyNumber = order.propertyNumber || '-';
    const floor = order.floor || '-';
    const apartmentNumber = order.apartmentNumber || '-';

                    // 1. تحديد الـ statusType بشكل موحد
                    const statusType = (currentStatus === 'تم التسليم' ? 'delivered' :
                        currentStatus === 'ملغي' ? 'canceled' :
                        currentStatus === 'مؤجل' ? 'postponed' : 'pending');

                    const waMessage = encodeURIComponent(`مرحباً، بخصوص الطلب رقم: ${orderId} للعميل: ${customerName}`);
                    const isOpen = openedOrders.has(String(orderId)) ? 'open' : '';

                    if (currentStatus === "تم التسليم") {
                        const numericPrice = parseFloat(String(price).replace(/[^\d.]/g, '')) || 0;
                        totalWalletAmount += numericPrice;
                    }

                    const orderHtml = `
                        <details ${isOpen} data-order-id="${orderId}" data-status-type="${currentStatus === 'تم التسليم' ? 'delivered' : currentStatus === 'ملغي' ? 'canceled' : 'pending'}" class="bg-white border border-outline-variant shadow-sm group order-item-card">
                            <summary class="p-4 cursor-pointer">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <div class="flex items-center gap-4">
                                            <span class="text-[12px] font-bold text-on-surface-variant">اسم الشركة</span>
                                            <h3 class="text-[14px] font-bold text-primary">${companyName}</h3>
                                        </div>
                                        <div class="flex items-center gap-4 mt-1">
                                            <span class="text-[12px] text-on-surface-variant">سعر الطلب</span>
                                            <h3 class="text-[14px] text-primary">${price}</h3>
                                        </div>
                                    </div>
                                    

                                    <div class="flex items-start gap-2 ">

                                        <div class="flex flex-col">
                                            <div>
                                                <span id="status-badge-${orderId}" class="text-[10px] px-2 py-1 rounded font-bold ${
                                                    currentStatus === 'تم التسليم' ? 'bg-green-100 text-green-800' :
                                                    currentStatus === 'ملغي' ? 'bg-red-100 text-red-800' :
                                                    currentStatus === 'مؤجل' ? 'bg-amber-100 text-amber-800' :
                                                    'bg-orange-50 text-zinc-800 border border-zinc-200'
                                                }">
                                                    ${currentStatus === '' || currentStatus === 'undefined' ? 'جاري المعالجة' : currentStatus}
                                                </span>
                                            </div>
                                            <div>
                                                <span class="text-[10px] px-2 py-1 text-zinc-600 rounded font-bold">
                                                    ${area}
                                                </span>                                
                                            </div>
                                        </div>
                                        <span class="material-symbols-outlined transition-transform duration-200 expand-icon text-on-surface-variant">expand_more</span>

                                    </div>

                                </div>
                            </summary>
                      
                            <div class="px-4 pb-4 border-t border-dashed border-outline-variant pt-4">
                                <div class="space-y-4 mb-6">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-start gap-3">
                                            <div class="bg-surface-container rounded p-1.5">
                                                <span class="material-symbols-outlined text-[20px] text-on-surface">person</span>
                                            </div>
                                            <div>
                                                <span class="text-[12px] text-on-surface-variant block">اسم العميل</span>
                                                <p class="text-body-md font-semibold">${customerName}</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2">
                                             <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}" target="_blank" class="text-green-600 font-bold p-1">
                                                 <span class="material-symbols-outlined">forum</span>
                                             </a>
                                             <div>
                                                 <span class="text-[12px] text-on-surface-variant block">رقم الطلب</span>
                                                 <h3 class="text-[14px] text-primary">${orderId}</h3>
                                             </div>
                                        </div>
                                    </div>
                              
                                    <div class="flex items-start gap-3">
                                        <div class="bg-surface-container rounded p-1.5">
                                            <span class="material-symbols-outlined text-[20px] text-on-surface">call</span>
                                        </div>
                                        <div class="flex-1">
                                            <span class="text-[12px] text-on-surface-variant block">رقم الهاتف</span>
                                            <p class="text-body-sm">${phoneNumber}</p>
                                        </div>
                                        <a href="tel:${phoneNumber}" class="self-center">
                                            <span class="material-symbols-outlined text-secondary">phone</span>
                                        </a>
                                    </div>
                              
                                    <div class="flex items-start gap-3">
                                        <div class="bg-surface-container rounded p-1.5">
                                            <span class="material-symbols-outlined text-[20px] text-on-surface">location_on</span>
                                        </div>
                                        <div class="flex-1">
                                            <span class="text-[12px] text-on-surface-variant block">عنوان التسليم</span>
                                            <p class="text-body-sm">${address}</p>
                                        </div>
                                    </div>
                              
                                    <table class="w-full text-right mt-2 text-sm">
                                        <thead>
                                            <tr class="bg-zinc-50 text-on-surface-variant">
                                                <th class="p-1.5">علامة مميزة</th>
                                                <th class="p-1.5">رقم العقار</th>
                                                <th class="p-1.5">الدور</th>
                                                <th class="p-1.5">الشقة</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td class="p-1.5">${mark}</td>
                                                <td class="p-1.5">${propertyNumber}</td>
                                                <td class="p-1.5">${floor}</td>
                                                <td class="p-1.5">${apartmentNumber}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                ${currentStatus === "تم التسليم" ? `
                                    <div class="w-full bg-green-100 text-green-700 text-center py-3 font-bold rounded">
                                        تم تسليم الطلب
                                    </div>
                                ` : currentStatus === "ملغي" ? `
                                    <div class="w-full bg-red-100 text-red-700 text-center py-3 font-bold rounded">
                                        هذا الطلب ملغي
                                    </div>
                                ` : currentStatus === "مؤجل" ? `
                                    <div class="w-full bg-amber-100 text-amber-700 text-center py-3 font-bold rounded">
                                        تم تأجيل الطلب
                                    </div>
                                ` : `
                                <div class="flex grid-cols-1 gap-2">
                                    <button onclick="markAsDelivered(event, '${orderId}')" class="w-full bg-black text-white font-button py-3 transition-all active:scale-[0.98]">
                                        تم التوصيل
                                    </button>
                                    <button onclick="markAsPostponed(event, '${orderId}')" class="w-full bg-amber-600 text-white font-button py-3 transition-all active:scale-[0.98]">
                                        تأجيل
                                    </button>
                                    <button onclick="markAsCanceled(event, '${orderId}')" class="w-full bg-red-600 text-white font-button py-3 transition-all active:scale-[0.98]">
                                        طلب ملغي
                                    </button>
                                </div>
                                `}
                            </div>
                        </details>
                    `;

                    if (currentStatus === "تم التسليم" || currentStatus === "ملغي" || currentStatus === "مؤجل") {
                        deliveredContainer.innerHTML += orderHtml;
                        hasDelivered = true;
                    } else {
                        pendingContainer.innerHTML += orderHtml;
                        hasPending = true;
                    }
                });

                if (!hasPending) pendingContainer.innerHTML = '<p class="text-center text-zinc-500 py-4">لا توجد طلبات معلقة.</p>';
                if (!hasDelivered) deliveredContainer.innerHTML = '<p class="text-center text-zinc-500 py-4">لا توجد طلبات مستلمة أو ملغاة.</p>';

                document.getElementById('wallet-total').innerText = totalWalletAmount.toLocaleString('ae-EG');

                filterDeliveredOrders();

            } catch (error) {
                console.error("حدث خطأ:", error);
                document.getElementById('orders-container').innerHTML = '<p class="text-center text-red-500 py-4">فشل في تحميل البيانات.</p>';
            }
        }

        function filterDeliveredOrders() {
            const filterValue = document.getElementById('status-filter').value; // سيأتي بقيمة 'delivered', 'canceled', 'postponed'
            const items = document.querySelectorAll('#delivered-container .order-item-card');

            items.forEach(item => {
                const itemStatus = item.getAttribute('data-status-type'); // سيطابق القيم أعلاه
                if (filterValue === 'all') {
                    item.classList.remove('hidden');
                } else if (filterValue === itemStatus) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        }

        async function markAsDelivered(event, orderId) {
            const btn = event.target;
            btn.innerText = "جاري التحديث...";
            btn.disabled = true;

            try {
                await fetch(SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: orderId, action: 'deliver' })
                });

                btn.innerText = "تم التوصيل!";
                btn.className = "w-full bg-green-600 text-white font-button py-4 text-center rounded";

                setTimeout(() => { loadOrders(); }, 1000);
            } catch (e) {
                console.error(e);
                btn.innerText = "خطأ!";
                btn.disabled = false;
            }
        }

        async function markAsPostponed(event, orderId) {
            const btn = event.target;
            btn.innerText = "جاري التأجيل...";
            btn.disabled = true;

            try {
                await fetch(SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: orderId, action: 'postpone' })
                });

                btn.innerText = "تم التأجيل!";
                btn.className = "w-full bg-amber-800 text-white font-button py-3 text-center rounded";

                setTimeout(() => { loadOrders(); }, 1000);
            } catch (e) {
                console.error(e);
                btn.innerText = "خطأ!";
                btn.disabled = false;
            }
        }

        async function markAsCanceled(event, orderId) {
            const btn = event.target;
            btn.innerText = "جاري الإلغاء...";
            btn.disabled = true;

            try {
                await fetch(SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: orderId, action: 'cancel' })
                });

                btn.innerText = "تم الإلغاء!";
                btn.className = "w-full bg-red-800 text-white font-button py-4 text-center rounded";

                setTimeout(() => { loadOrders(); }, 1000);
            } catch (e) {
                console.error(e);
                btn.innerText = "خطأ!";
                btn.disabled = false;
            }
        }

        function showTab(tabName) {
            const pendingSec = document.getElementById('pending-section');
            const deliveredSec = document.getElementById('delivered-section');
            const profileSec = document.getElementById('profile-section');

            const btnPending = document.getElementById('btn-pending');
            const btnDelivered = document.getElementById('btn-delivered');
            const btnProfile = document.getElementById('btn-profile');

            pendingSec.classList.add('hidden');
            deliveredSec.classList.add('hidden');
            profileSec.classList.add('hidden');

            btnPending.classList.replace('text-[#fd761a]', 'text-zinc-400');
            btnDelivered.classList.replace('text-[#fd761a]', 'text-zinc-400');
            btnProfile.classList.replace('text-[#fd761a]', 'text-zinc-400');

            if (tabName === 'pending') {
                pendingSec.classList.remove('hidden');
                btnPending.classList.replace('text-zinc-400', 'text-[#fd761a]');
            } else if (tabName === 'delivered') {
                deliveredSec.classList.remove('hidden');
                btnDelivered.classList.replace('text-zinc-400', 'text-[#fd761a]');
            } else if (tabName === 'profile') {
                profileSec.classList.remove('hidden');
                btnProfile.classList.replace('text-zinc-400', 'text-[#fd761a]');
            }
        }

        window.onload = loadOrders;
        setInterval(loadOrders, 10000);
    </script>
</body>

</html>
