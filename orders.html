<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&amp;family=Inter:wght@400;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }

        .font-h1,
        .font-h2,
        .font-h3,
        .font-public-sans {
            font-family: 'Public Sans', sans-serif;
        }

        /* Custom Accordion Logic with Details/Summary for no-JS simulation */
        details summary::-webkit-details-marker {
            display: none;
        }

        details summary {
            list-style: none;
        }

        details[open] .expand-icon {
            transform: rotate(180deg);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        th,
        td {
            border: 1px solid #e7e8ed;
        }
    </style>
</head>

<body class="bg-surface">
    <!-- TopAppBar -->
    <header
        class="bg-white dark:bg-zinc-950 docked full-width top-0 z-50 border-b border-zinc-200 dark:border-zinc-800 flex justify-between items-center h-16 px-4 w-full fixed">
        <div class="flex items-center gap-2">
            <button
                class="transition-all duration-200 ease-in-out hover:bg-zinc-50 dark:hover:bg-zinc-900 p-2 rounded-lg relative">
                <span class="material-symbols-outlined text-black dark:text-white">notifications</span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-secondary-container rounded-full"></span>
            </button>
        </div>
        <div class="flex items-center gap-4">
            <p class="font-['Public_Sans'] font-semibold tracking-tight text-base text-black dark:text-white">أهلاً بك
                يا احمد</p>
            <h1 class="font-['Public_Sans'] font-semibold tracking-tight text-base text-black dark:text-white">Quick-XOS
            </h1>
        </div>
    </header>

    <main class="pt-20 pb-24 px-4 max-w-lg mx-auto">
        <!-- الحاوية الديناميكية التي سيتم حقن الطلبات داخلها -->
        <div id="orders-container" class="space-y-4">
            <p class="text-center text-zinc-500 py-4">جاري التحميل ..</p>
        </div>
    </main>

    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 left-0 w-full h-16 flex justify-around items-center bg-white dark:bg-zinc-950 px-2 pb-safe border-t border-zinc-200 dark:border-zinc-800 z-50">


        <div id="pending-section">
            <div id="orders-container">

            </div>
        </div>

        <div id="delivered-section" class="hidden">
            <div id="delivered-container"></div>
        </div>

        <button class="flex flex-col items-center justify-center text-[#fd761a]" onclick="showTab('pending')">
            <span class="material-symbols-outlined">assignment</span>
            <span>Orders</span>
        </button>

        <button class="flex flex-col items-center justify-center text-zinc-400" onclick="showTab('delivered')">
            <span class="material-symbols-outlined">assignment</span>
            <span>Delivered</span>
        </button>

        
        <a class="flex flex-col items-center justify-center text-zinc-400" href="profile.html">
            <span class="material-symbols-outlined">person</span>
            <span class="font-['Public_Sans'] text-[10px] uppercase font-bold tracking-tighter">Profile</span>
        </a>
    </nav>

    <script>
        
        // ⚠️ ضع هنا الرابط الخاص بك الذي حصلت عليه (سواء رابط Sheety أو SheetDB أو سكريبت جوجل)
        const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxJb8ZGEBFA8wciz8NWg5JlAzQxV9KLfVh3LcL4pk335xIF7Gf13_0Bzyi70Ny4tA8nmg/exec';

        // ⚠️ رقم الواتساب (بدون + أو 00)
        const WHATSAPP_NUMBER = '+201063942602';

        async function loadOrders() {
            try {
                const response = await fetch(SHEET_API_URL);
                const orders = await response.json();

                const container = document.getElementById('orders-container');
                container.innerHTML = ''; // تفريغ نص التحميل

                if (orders.length === 0) {
                    container.innerHTML = '<p class="text-center text-zinc-500 py-4">لا توجد طلبات حالياً.</p>';
                    return;
                }

                // بناء الطلبات ديناميكياً بناءً على الأعمدة الموجودة بالشيت
                orders.forEach(order => {
                    // استخراج البيانات لسهولة الاستخدام
                    const orderId = order['رقم الطلب'] || order.orderId || '';
                    const customerPhone = order['رقم الهاتف'] || order.phone || '';
                    const customerName = order['اسم العميل'] || order.customerName || '';

                    // نص الرسالة للواتساب
                    const waMessage = encodeURIComponent(`مرحباً، بخصوص الطلب رقم: ${orderId} للعميل: ${customerName}`);

                    container.innerHTML += `
                        <details class="bg-white border border-outline-variant shadow-sm group">
                            <summary class="p-4 cursor-pointer">
                            <div class="flex justify-between items-start">
                              <div>
                                <div class="flex items-center gap-4">
                                  <span class="text-[12px] font-bold text-on-surface-variant">اسم الشركة</span>
                                  <h3 class="text-[14px] font-bold text-primary">${order['اسم الشركه'] || order.companyName || ''}</h3>
                                </div>
                                <div class="flex items-center gap-4 mt-1">
                                  <span class="text-[12px] text-on-surface-variant">سعر الطلب</span>
                                  <h3 class="text-[14px] text-primary">${order['سعر الطلب'] || order.price || ''}</h3>
                                </div>
                              </div>
                              <div class="flex items-center gap-2">
                                <p class="text-[12px] text-on-surface-variant mt-1">${order['المنطقة'] || order.region || ''}</p>
                                <span class="material-symbols-outlined transition-transform duration-200 expand-icon text-on-surface-variant">expand_more</span>
                              </div>
                            </div>
                          </summary>
                      
                          <div class="px-4 pb-4 border-t border-dashed border-outline-variant pt-4">
                            <div class="space-y-4 mb-6">
                              <div class="flex items-center justify-between">
                                <div class="flex items-start gap-3">
                                    <div class="bg-surface-container rounded p-1.5">
                                      <span class="material-symbols-outlined text-[20px] text-on-surface">person</span>
                                    </div>
                                    <div>
                                      <span class="text-[12px] text-on-surface-variant block">اسم العميل</span>
                                      <p class="text-body-md font-semibold">${order['اسم العميل'] || order.customerName || ''}</p>
                                    </div>
                                </div>

                                <div class="flex items-start gap-3">
                                
                                    

                                    <div class="flex items-start gap-3">
                                        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}" target="_blank"
                                            class="flex items-center justify-center gap-2  text-green-600 font-bold transition-all active:scale-[0.98]">
                                            <span class="material-symbols-outlined">forum</span>
                                        </a>
                                    </div>

                                    <div class="flex items-start gap-3">
                                        <div>
                                            <span class="text-[12px] text-on-surface-variant block">رقم الطلب</span>
                                            <h3 class="text-[14px] text-primary">${order['رقم الطلب'] || order.orderId || ''}</h3>
                                        </div>
                                    </div>
                                </div>
                                
                              </div>
                          
                              <div class="flex items-start gap-3">
                                <div class="bg-surface-container rounded p-1.5">
                                  <span class="material-symbols-outlined text-[20px] text-on-surface">call</span>
                                </div>
                                <div class="flex-1">
                                  <span class="text-[12px] text-on-surface-variant block">رقم الهاتف</span>
                                  <p class="text-body-sm">${order['رقم الهاتف'] || order.phone || ''}</p>
                                </div>
                                <a href="tel:${order['رقم الهاتف'] || order.phone || ''}" class="self-center">
                                  <span class="material-symbols-outlined text-secondary">phone</span>
                                </a>
                              </div>
                          
                              <div class="flex items-start gap-3">
                                <div class="bg-surface-container rounded p-1.5">
                                  <span class="material-symbols-outlined text-[20px] text-on-surface">location_on</span>
                                </div>
                                <div class="flex-1">
                                  <span class="text-[12px] text-on-surface-variant block">عنوان التسليم</span>
                                  <p class="text-body-sm">${order['عنوان التسليم'] || order.address || ''}</p>
                                </div>
                              </div>
                          
                              <table class="w-full text-right mt-2 text-sm">
                                <thead>
                                  <tr class="bg-zinc-50 text-on-surface-variant">
                                    <th class="p-1.5">علامة مميزة</th>
                                    <th class="p-1.5">رقم العقار</th>
                                    <th class="p-1.5">الدور</th>
                                    <th class="p-1.5">الشقة</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  <tr>
                                    <td class="p-1.5">${order['علامه مميزه'] || order.landmark || '-'}</td>
                                    <td class="p-1.5">${order['رقم العقار'] || order.building || '-'}</td>
                                    <td class="p-1.5">${order['الدور'] || order.floor || '-'}</td>
                                    <td class="p-1.5">${order['رقم الشقة'] || order.apartment || '-'}</td>
                                  </tr>
                                </tbody>
                              </table>
                            </div>

                            <button 
                                onclick="markAsDelivered('${orderId}')" 
                                class="w-full bg-black text-white font-button text-button py-4 transition-all active:scale-[0.98]">
                                تم التوصيل
                            </button>
                          </div>
                        </details>
                        `;
                });

            } catch (error) {
                console.error("حدث خطأ أثناء جلب البيانات:", error);
                document.getElementById('orders-container').innerHTML = '<p class="text-center text-red-500 py-4">فشل في تحميل البيانات، يرجى التحقق من الرابط.</p>';
            }
        }
        async function markAsDelivered(orderId) {
            const btn = event.target;
            btn.innerText = "جاري التحديث...";
            btn.disabled = true;

            try {
                // أضفنا mode: 'no-cors'
                const response = await fetch(SHEET_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ orderId: orderId })
                });

                // ملاحظة: مع no-cors، لا يمكنك قراءة نتيجة الـ JSON، لذا سنفترض النجاح
                btn.innerText = "تم التوصيل!";
                btn.classList.replace('bg-black', 'bg-green-600');

                setTimeout(() => {
                    loadOrders();
                }, 1000);

            } catch (e) {
                console.error("خطأ في الاتصال:", e);
                btn.innerText = "خطأ!";
                btn.disabled = false;
            }
        }
        // استدعاء الدالة عند تحميل الصفحة تلقائياً
        window.onload = loadOrders;

        // تحديث البيانات كل 5000 مللي ثانية (أي 5 ثواني)
        setInterval(loadOrders, 5000);

    </script>
</body>

</html>
